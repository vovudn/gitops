apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api
  namespace: demo
  labels:
    app: api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        test-run: "inject-errors-for-email-test"
    spec:
      containers:
        - name: api
          image: w9-api:3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ERROR_RATE
              value: "0.15"
            - name: VERSION
              value: "v3-error"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: {}
        - setWeight: 50
        - pause: { duration: 30s }
        - setWeight: 100
        - pause: {}
      analysis:
        templates:
          - templateName: error-rate-analysis
        startingStep: 1
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: demo
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: error-rate-analysis
  namespace: demo
spec:
  metrics:
    - name: error-rate
      interval: 30s
      successCondition: result == 0 || result < 0.05
      failureLimit: 3
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
          query: |
            scalar(
              sum(rate(flask_http_request_total{namespace="demo",status=~"5.."}[1m])) or vector(0)
            ) / 
            scalar(
              sum(rate(flask_http_request_total{namespace="demo"}[1m])) or vector(1)
            )
